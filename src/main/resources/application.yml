spring:
  data:
    redis:
      # Serving layer — StatsSyncConsumer writes here, RedisStatsService reads here.
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  kafka:
    # Override via SPRING_KAFKA_BOOTSTRAP_SERVERS env var in Docker / K8s.
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

    # Plain consumer (not Kafka Streams) for StatsSyncConsumer, reading user-stats-topic
    # and writing each update into Redis. Bytes on that topic have no type header
    # (written by the Streams topology's own JsonSerde), so we pin the target type
    # explicitly instead of relying on headers.
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.use.type.headers: false
        spring.json.value.default.type: org.example.model.UserStats
        spring.json.trusted.packages: org.example.model

    streams:
      application-id: kstreams-demo
      # Override via SPRING_KAFKA_STREAMS_STATE_DIR in Docker / K8s (points to a PVC).
      state-dir: ${SPRING_KAFKA_STREAMS_STATE_DIR:./kafka-streams-state}
      properties:
        commit.interval.ms: 1000
        auto.offset.reset: earliest

  # Graceful shutdown: Spring waits up to 30 s for in-flight requests and
  # Kafka Streams to commit + close RocksDB before the process exits.
  # K8s terminationGracePeriodSeconds (45 s) must be > this value.
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Exposes /actuator/health/liveness and /actuator/health/readiness
      # used by K8s liveness and readiness probes.
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    org.example: INFO
    org.apache.kafka: WARN
