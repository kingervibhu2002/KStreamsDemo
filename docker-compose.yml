services:

  # ── Kafka (KRaft, single broker) ────────────────────────────────────────────
  kafka:
    image: bitnami/kafka:3.9
    hostname: kafka
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      ALLOW_PLAINTEXT_LISTENER: "yes"
      # Relax replication requirements for single-broker dev
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "9092:9092"     # expose for local tools (kafka-topics.sh, etc.)
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Topic initialiser (runs once, exits) ────────────────────────────────────
  kafka-init:
    image: bitnami/kafka:3.9
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      kafka-topics.sh --bootstrap-server kafka:9092 \
        --create --if-not-exists --topic purchases  --partitions 3 --replication-factor 1
      kafka-topics.sh --bootstrap-server kafka:9092 \
        --create --if-not-exists --topic user-stats --partitions 3 --replication-factor 1
      echo 'Topics ready.'
      "

  # ── Spring Boot Kafka Streams app ───────────────────────────────────────────
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # RocksDB state is written to the named volume below
      SPRING_KAFKA_STREAMS_STATE_DIR: /data/kafka-streams-state
    volumes:
      - rocksdb-data:/data
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

volumes:
  rocksdb-data:
