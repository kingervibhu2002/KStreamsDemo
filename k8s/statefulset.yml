# StatefulSet — NOT a Deployment — because:
#
#   1. Each pod owns a fixed subset of Kafka partitions.  Restart must land on
#      the same pod so it finds its local RocksDB rather than replaying from
#      the changelog (slow).
#
#   2. volumeClaimTemplates give each pod its own PVC — RocksDB data survives
#      pod restarts without a full changelog replay.
#
# Reads no longer need stable per-pod DNS names: StatsController reads from Redis
# (populated by StatsSyncConsumer off user-stats-topic), which is shared across every
# instance, so any pod can answer a query for any userId — no cross-pod IQ routing.
# The StatefulSet shape is kept purely for RocksDB restart efficiency on the
# processing side, not for the read path.
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kstreams-demo
  namespace: kafka-demo
spec:
  serviceName: kstreams-headless   # must match the headless Service name
  replicas: 3
  selector:
    matchLabels:
      app: kstreams-demo
  template:
    metadata:
      labels:
        app: kstreams-demo
    spec:
      terminationGracePeriodSeconds: 45   # give Streams time to commit + close RocksDB
      containers:
        - name: app
          image: kstreams-demo:latest     # replace with your registry path
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          # SPRING_DATA_REDIS_HOST should point at the Redis Service in this namespace —
          # set it in the kstreams-config ConfigMap.
          envFrom:
            - configMapRef:
                name: kstreams-config
          volumeMounts:
            - name: rocksdb-data
              mountPath: /data
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"    # JVM gets 65% (~650 MB heap); rest for RocksDB off-heap
              cpu: "1000m"
          # Liveness: JVM is alive. Restart the pod if this fails.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3
          # Readiness: Streams has reached RUNNING state. Only then send traffic.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 6

  # Each pod gets its own PVC — RocksDB state persists across restarts.
  volumeClaimTemplates:
    - metadata:
        name: rocksdb-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
