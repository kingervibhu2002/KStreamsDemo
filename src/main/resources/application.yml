# This pod's own host:port — used by Kafka Streams to advertise itself to peers
# and by StoreQueryService to decide whether to serve locally or forward.
# Set APPLICATION_SERVER env var in Docker / K8s to override.
app:
  instance-address: ${APPLICATION_SERVER:localhost:8080}

spring:
  kafka:
    # Override via SPRING_KAFKA_BOOTSTRAP_SERVERS env var in Docker / K8s.
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

    streams:
      application-id: kstreams-demo
      # Override via SPRING_KAFKA_STREAMS_STATE_DIR in Docker / K8s (points to a PVC).
      state-dir: ${SPRING_KAFKA_STREAMS_STATE_DIR:./kafka-streams-state}
      properties:
        commit.interval.ms: 1000
        auto.offset.reset: earliest
        # Advertised to peers so they know where to forward IQ requests.
        # Matches app.instance-address via the same APPLICATION_SERVER env var.
        application.server: ${APPLICATION_SERVER:localhost:8080}

  # Graceful shutdown: Spring waits up to 30 s for in-flight requests and
  # Kafka Streams to commit + close RocksDB before the process exits.
  # K8s terminationGracePeriodSeconds (45 s) must be > this value.
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Exposes /actuator/health/liveness and /actuator/health/readiness
      # used by K8s liveness and readiness probes.
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    org.example: INFO
    org.apache.kafka: WARN
